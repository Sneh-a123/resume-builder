<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<body class="md:h-screen overflow-hidden bg-[#fafafa]">
    <h3 class="font-bold p-10 text-[20px] md:text-[30px]">Resume Builder</h3>
    <section class="p-3 md:p-10 flex flex-col md:flex-row justify-center items-center gap-10">
        <div class="w-full md:w-[50%]">
            <h1 class="text-center text-[50px] leading-tight font-extrabold">Just three simple steps</h1>
            <div class="flex align-item-center justify-center  mt-10">
                <ol class="list-decimal pl-5 space-y-3 text-[17px] md:text-[20px]">
                    <li><strong>Select</strong> a template from our library of professional designs</li>
                    <li><strong>Build</strong> your resume with our industry-specific bullet points</li>

                </ol>
            </div>
        </div>
        <div class="flex flex-col justify-center items-center w-full md:w-[50%]">
            <video width="300" autoplay muted loop>
                <source src="./image/Untitled design.mp4" type="video/mp4">
            </video>
            <a href="./experience-level.html"><button class="cursor-pointer text-center bg-black text-white py-2 w-full md:w-fit px-15 hover:scale-107 rounded mt-10">Next</button></a>

    </section>
